<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="description" content="ActionEditor、ActionBuffer、ActionAttribute、节点图与行为树完整文档">
  <title>ActionEditor 文档</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #2f7d68; }
    body { letter-spacing: 0; }
    .app-name-link { font-weight: 700; }
    .markdown-section { max-width: 1040px; }
    .markdown-section code { border-radius: 3px; }
    .markdown-section table { display: table; width: 100%; }
    .sidebar { width: 290px; }
    .content { left: 290px; }
    @media screen and (max-width: 768px) {
      .sidebar { width: 280px; }
      .content { left: 0; }
    }
  </style>
</head>
<body>
  <div id="app">正在加载文档...</div>
  <script>
    window.$docsify = {
      name: 'ActionEditor',
      repo: 'https://github.com/OnClick9927/ActionEditor',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      relativePath: true,
      search: {
        paths: 'auto',
        placeholder: '搜索文档',
        noData: '没有找到相关内容',
        depth: 4,
        namespace: 'ActionEditor'
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
</body>
</html>
